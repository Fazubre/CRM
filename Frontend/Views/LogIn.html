<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación CRM de Voyager</title>
    <link rel="stylesheet" href="../css/LogIn.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <a href="dashboard.html" class="site-logo text-decoration-none d-flex align-items-center">
                <img src="../images/Logo Voyager Blanco.svg" alt="Logo Voyager" class="logo-voyager">
                </a>
                <h2>Sign In</h2>
                <p>Access your account</p>
            </div>

            <div class="divider">
                <span>or</span>
            </div>

            <div class="social-login">
                <div id="googleLoginContainer" class="google-login-container"></div>

                <button type="button" class="social-btn switch-account-btn" id="switchAccountBtn">
                    <span>Change Google account</span>
                </button>
            </div>

            <div class="success-message" id="successMessage">
                <div class="success-icon">✓</div>
                <h3>Welcome back!</h3>
                <p id="successText">Redirecting to your dashboard...</p>
            </div>

            <div id="statusMessage" class="status-message"></div>
        </div>

        <div class="background-effects">
            <div class="glow-orb glow-orb-1"></div>
            <div class="glow-orb glow-orb-2"></div>
            <div class="glow-orb glow-orb-3"></div>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client"></script>
    <script src="../js/logIn.js"></script>
</body>
</html>
