<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Calendar | CRM Voyager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="with-side-menu-compact">

    <main class="page-content">
        <div class="container-fluid">
            <div class="box-typical">
                <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
                    <div>
                        <h1 class="mb-2">Google Calendar</h1>
                        <p class="text-muted mb-0">
                            Conecta la cuenta de Google Calendar de un empleado para recibir automáticamente los vencimientos de tickets asignados.
                        </p>
                    </div>

                    <a href="/Views/dashboard.html" class="btn btn-outline-secondary">
                        Volver al dashboard
                    </a>
                </div>

                <hr>

                <div id="calendarStatus" class="alert alert-info">
                    Revisando estado de conexión...
                </div>

                <div class="mb-3">
                    <label for="selectEmpleadoCalendar" class="form-label">Empleado</label>
                    <select id="selectEmpleadoCalendar" class="form-select">
                        <option value="">Cargando empleados...</option>
                    </select>
                </div>

                <button id="btnConectarCalendar" type="button" class="btn btn-primary">
                    Conectar Google Calendar
                </button>
            </div>
        </div>
    </main>

    <script src="../js/calendar.js"></script>
</body>
</html>
