<div
    class="modal fade"
    id="modalEstadoCalendar"
    tabindex="-1"
    aria-labelledby="modalEstadoCalendarLabel"
    aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5
                    class="modal-title"
                    id="modalEstadoCalendarLabel"
                >
                    Estado de Google Calendar
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Cerrar"
                ></button>
            </div>

            <div class="modal-body">
                <div
                    id="modalEstadoCalendarAlert"
                    class="alert alert-info"
                    role="alert"
                >
                    Estado pendiente.
                </div>

                <div class="border rounded p-3 bg-light">
                    <p class="mb-1">
                        <strong>Empleado:</strong>
                        <span id="modalEstadoCalendarEmpleado">-</span>
                    </p>

                    <p class="mb-1">
                        <strong>Correo conectado:</strong>
                        <span id="modalEstadoCalendarCorreo">-</span>
                    </p>

                    <p class="mb-0">
                        <strong>Resultado:</strong>
                        <span id="modalEstadoCalendarResultado">-</span>
                    </p>
                </div>
            </div>

            <div class="modal-footer">
                <button
                    type="button"
                    class="btn btn-primary"
                    data-bs-dismiss="modal"
                >
                    Entendido
                </button>
            </div>
        </div>
    </div>
</div>
