<div
    class="modal fade"
    id="modalConectarCalendar"
    tabindex="-1"
    aria-labelledby="modalConectarCalendarLabel"
    aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5
                    class="modal-title"
                    id="modalConectarCalendarLabel"
                >
                    Conectar Google Calendar
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Cerrar"
                ></button>
            </div>

            <div class="modal-body">
                <div
                    id="alertaModalCalendar"
                    class="alert alert-warning d-none"
                    role="alert"
                ></div>

                <p class="mb-3">
                    Se conectará la cuenta de Google Calendar del empleado seleccionado.
                    Los tickets asignados con fecha límite aparecerán automáticamente en su calendario.
                </p>

                <div class="border rounded p-3 bg-light">
                    <p class="mb-1">
                        <strong>Empleado:</strong>
                        <span id="modalCalendarEmpleadoNombre">-</span>
                    </p>

                    <p class="mb-1">
                        <strong>Correo:</strong>
                        <span id="modalCalendarEmpleadoCorreo">-</span>
                    </p>

                    <p class="mb-0">
                        <strong>Estado:</strong>
                        <span id="modalCalendarEmpleadoEstado">-</span>
                    </p>
                </div>

                <p class="text-muted mt-3 mb-0">
                    Asegúrate de iniciar sesión con la cuenta de Google correcta.
                </p>
            </div>

            <div class="modal-footer">
                <button
                    type="button"
                    class="btn btn-outline-secondary"
                    data-bs-dismiss="modal"
                >
                    Cancelar
                </button>

                <button
                    type="button"
                    id="btnConfirmarConectarCalendar"
                    class="btn btn-primary"
                >
                    Conectar Calendar
                </button>
            </div>
        </div>
    </div>
</div>
