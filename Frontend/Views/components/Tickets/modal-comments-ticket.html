<div
    class="modal fade"
    id="modalVerTicket"
    tabindex="-1"
    aria-labelledby="modalVerTicketLabel"
    aria-hidden="true"
>
    <div
        class="modal-dialog modal-xl modal-dialog-scrollable"
    >
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h5
                        class="modal-title"
                        id="modalVerTicketLabel"
                    >
                        Detalles del ticket
                    </h5>

                    <p class="text-muted small mb-0">
                        Información completa del ticket seleccionado
                    </p>
                </div>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Cerrar"
                ></button>
            </div>

            <div class="modal-body">
                <section class="mb-4">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <div
                                class="border rounded p-3 h-100"
                            >
                                <div
                                    class="small text-muted mb-1"
                                >
                                    Número
                                </div>

                                <strong
                                    id="verNumeroTicket"
                                >
                                    -
                                </strong>
                            </div>
                        </div>

                        <div class="col-md-3">
                            <div
                                class="border rounded p-3 h-100"
                            >
                                <div
                                    class="small text-muted mb-1"
                                >
                                    Estado
                                </div>

                                <strong
                                    id="verEstado"
                                >
                                    -
                                </strong>
                            </div>
                        </div>

                        <div class="col-md-3">
                            <div
                                class="border rounded p-3 h-100"
                            >
                                <div
                                    class="small text-muted mb-1"
                                >
                                    Prioridad
                                </div>

                                <strong
                                    id="verPrioridad"
                                >
                                    -
                                </strong>
                            </div>
                        </div>

                        <div class="col-md-3">
                            <div
                                class="border rounded p-3 h-100"
                            >
                                <div
                                    class="small text-muted mb-1"
                                >
                                    Fecha de vencimiento
                                </div>

                                <strong
                                    id="verVencimiento"
                                >
                                    -
                                </strong>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="mb-4">
                    <h6 class="mb-3">
                        <i
                            class="fa-solid fa-ticket me-2"
                        ></i>

                        Información principal
                    </h6>

                    <div class="row g-3">
                        <div class="col-12">
                            <label
                                class="form-label text-muted small"
                            >
                                Título
                            </label>

                            <div
                                id="verTitulo"
                                class="form-control bg-light"
                            >
                                -
                            </div>
                        </div>

                        <div class="col-md-4">
                            <label
                                class="form-label text-muted small"
                            >
                                Cliente
                            </label>

                            <div
                                id="verCliente"
                                class="form-control bg-light"
                            >
                                -
                            </div>
                        </div>

                        <div class="col-md-4">
                            <label
                                class="form-label text-muted small"
                            >
                                Área
                            </label>

                            <div
                                id="verArea"
                                class="form-control bg-light"
                            >
                                -
                            </div>
                        </div>

                        <div class="col-md-4">
                            <label
                                class="form-label text-muted small"
                            >
                                Empleado asignado
                            </label>

                            <div
                                id="verEmpleadoAsignado"
                                class="form-control bg-light"
                            >
                                -
                            </div>
                        </div>

                        <div class="col-12">
                            <label
                                for="verDescripcion"
                                class="form-label text-muted small"
                            >
                                Descripción
                            </label>

                            <textarea
                                id="verDescripcion"
                                class="form-control bg-light"
                                rows="5"
                                readonly
                            ></textarea>
                        </div>
                    </div>
                </section>

                <section class="mb-4">
                    <h6 class="mb-3">
                        <i
                            class="fa-solid fa-paperclip me-2"
                        ></i>

                        Adjunto principal
                    </h6>

                    <div
                        id="verArchivoDisponible"
                        class="border rounded p-3 d-none"
                    >
                        <div
                            class="d-flex flex-wrap align-items-center justify-content-between gap-3"
                        >
                            <div>
                                <strong
                                    id="verArchivoNombre"
                                ></strong>

                                <div
                                    id="verArchivoTipo"
                                    class="small text-muted mt-1"
                                ></div>
                            </div>

                            <a
                                id="verArchivoEnlace"
                                class="btn btn-outline-secondary btn-sm"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                Ver adjunto
                            </a>
                        </div>
                    </div>

                    <div
                        id="verArchivoSinAdjunto"
                        class="text-muted border rounded p-3"
                    >
                        Este ticket no tiene un adjunto principal.
                    </div>
                </section>

                <section class="mb-4">
                    <div
                        class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"
                    >
                        <h6 class="mb-0">
                            <i
                                class="fa-solid fa-comments me-2"
                            ></i>

                            Comentarios

                            <span
                                id="verCantidadComentarios"
                                class="badge bg-secondary ms-1"
                            >
                                0
                            </span>
                        </h6>

                        <div class="d-flex gap-2">
                            <button
                                type="button"
                                class="btn btn-outline-secondary btn-sm"
                                id="btnRecargarComentariosVer"
                            >
                                <i
                                    class="fa-solid fa-rotate me-1"
                                ></i>

                                Recargar
                            </button>

                            <button
                                type="button"
                                class="btn btn-primary btn-sm"
                                id="btnGestionarComentariosDesdeVer"
                            >
                                <i
                                    class="fa-solid fa-comment-dots me-1"
                                ></i>

                                Agregar comentario
                            </button>
                        </div>
                    </div>

                    <div
                        id="verListaComentarios"
                    >
                        <div
                            class="text-center text-muted py-4"
                        >
                            Cargando comentarios...
                        </div>
                    </div>
                </section>

                <section>
                    <h6 class="mb-3">
                        <i
                            class="fa-solid fa-clock-rotate-left me-2"
                        ></i>

                        Auditoría
                    </h6>

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label
                                class="form-label text-muted small"
                            >
                                Creado por
                            </label>

                            <div
                                id="verCreadoPor"
                                class="form-control bg-light"
                            >
                                -
                            </div>
                        </div>

                        <div class="col-md-4">
                            <label
                                class="form-label text-muted small"
                            >
                                Fecha de creación
                            </label>

                            <div
                                id="verFechaCreacion"
                                class="form-control bg-light"
                            >
                                -
                            </div>
                        </div>

                        <div class="col-md-4">
                            <label
                                class="form-label text-muted small"
                            >
                                Última actualización
                            </label>

                            <div
                                id="verFechaActualizacion"
                                class="form-control bg-light"
                            >
                                -
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <div class="modal-footer">
                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Cerrar
                </button>
            </div>
        </div>
    </div>
</div>
