<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM | Gestión de Tickets</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="with-side-menu-compact">

    <header class="site-header">
        <div class="container-fluid d-flex align-items-center justify-content-between">
            <a href="dashboard.html" class="site-logo text-decoration-none d-flex align-items-center">
                <img src="../images/Logo Voyager.svg" alt="Logo Voyager" class="logo-voyager">
            </a>

            <div class="dropdown user-menu">
                <button
                    class="dropdown-toggle btn btn-link text-decoration-none d-flex align-items-center gap-2"
                    id="dd-user-menu"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">
                    <span class="d-inline-flex justify-content-center align-items-center rounded-circle border"
                          style="width: 36px; height: 36px;">
                        <i class="fa-solid fa-user text-secondary"></i>
                    </span>
                    <span id="nombreUsuario">Usuario</span>
                </button>

                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dd-user-menu">
                    <li><a class="dropdown-item" href="dashboard.html">Dashboard</a></li>
                    <li><a class="dropdown-item" href="tickets.html">Tickets</a></li>
                    <li><a class="dropdown-item" href="employee.html">Empleados</a></li>
                    <li><a class="dropdown-item" href="clients.html">Clientes</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="LogIn.html">Cerrar sesión</a></li>
                </ul>
            </div>
        </div>
    </header>

    <div class="mobile-menu-left-overlay"></div>

    <nav class="side-menu side-menu-compact">
        <ul class="side-menu-list">
            <li class="brown">
                <a href="dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    <span class="lbl">Dashboard</span>
                </a>
            </li>

            <li class="blue">
                <a href="tickets.html" aria-current="page">
                    <i class="fa-solid fa-ticket"></i>
                    <span class="lbl">Tickets</span>
                </a>
            </li>

            <li class="green">
                <a href="employee.html">
                    <i class="fa-solid fa-users"></i>
                    <span class="lbl">Empleados</span>
                </a>
            </li>

            <li class="gold">
                <a href="clients.html">
                    <i class="fa-solid fa-building"></i>
                    <span class="lbl">Clientes</span>
                </a>
            </li>

            <!-- <li class="yellow">
                <a href="Calendar.html">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span class="lbl">Calendar</span>
                </a>
            </li> -->
        </ul>
    </nav>

    <main class="page-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                <div>
                    <h1 class="mb-1">Gestión de Tickets</h1>
                    <p class="text-muted mb-0">Administración general de tickets del CRM.</p>
                </div>

                <div class="d-flex gap-2 flex-wrap">
                    <button class="btn btn-outline-primary" id="btnRecargarTickets" type="button">
                        <i class="fa-solid fa-rotate-right me-2"></i>Recargar
                    </button>

                    <button class="btn btn-primary" id="btnNuevoTicket" type="button">
                        <i class="fa-solid fa-plus me-2"></i>Agregar Ticket
                    </button>
                </div>
            </div>

            <div class="dashboard-card">
                <div class="table-responsive">
                    <table id="tablaTickets" class="table table-striped align-middle w-100">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th># Ticket</th>
                                <th>Título</th>
                                <th>Cliente</th>
                                <th>Área</th>
                                <th>Empleado</th>
                                <th>Estado</th>
                                <th>Prioridad</th>
                                <th>Vencimiento</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="ticketsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div id="contenedorModalTicket"></div>
    <div id="contenedorModalVerTicket"></div>
    <div id="contenedorModalEditarTicket"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/tickets.js"></script>
</body>
</html>
